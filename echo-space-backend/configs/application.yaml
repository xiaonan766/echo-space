server:
  host: ""
  port: "7070"
  mode: "debug"

redis:
  addr: "localhost:6379"
  password: ""
  db: 0
  poolSize: 10

mysql:
  dsn: "root:root@tcp(localhost:3306)/echo_space?charset=utf8mb4&parseTime=True&loc=Local"
  maxIdleConns: 5
  maxOpenConns: 20
  connMaxLifetime: "1h"
  autoMigrate: false

elasticsearch:
  addresses:
    - "http://localhost:9200"
  username: ""
  password: ""
  indexVideoName: "echo_space_video"

rabbitmq:
  url: "amqp://guest:guest@localhost:5672/"
  cacheRecoveryQueue: "echo-space.shop.cache.recovery"
  stockLockQueue: "echo-space.shop.stock.lock"
  videoTranscodeQueue: "echo-space.video.transcode"
  dynamicFeedQueue: "echo-space.dynamic.feed"
  videoTranscodePrefetch: 1
  prefetchCount: 20

admin:
  account: "admin"
  password: "admin123"
  tokenTTL: "24h"

file:
  resourceRoot: "resources"
  maxImageMB: 10

commentReview:
  enabled: true
  rejectMessage: "评论包含敏感内容，请修改后再发布"
  sensitiveWords:
    - "广告"
    - "推广"
    - "引流"
    - "加微信"
    - "微信号"
    - "微信联系"
    - "vx"
    - "v信"
    - "加QQ"
    - "QQ群"
    - "联系QQ"
    - "兼职"
    - "刷单"
    - "返利"
    - "代刷"
    - "代充"
    - "代付"
    - "低价出售"
    - "博彩"
    - "赌博"
    - "彩票"
    - "赌球"
    - "赌场"
    - "开户"
    - "贷款"
    - "套现"
    - "办证"
    - "发票"
    - "裸聊"
    - "约炮"
    - "色情"
    - "成人网站"
    - "看片"
    - "外挂"
    - "破解"
    - "盗版资源"
